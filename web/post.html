<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Styio Community Post</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-grid" viewBox="0 0 24 24">
        <rect x="4" y="4" width="6" height="6"></rect>
        <rect x="14" y="4" width="6" height="6"></rect>
        <rect x="4" y="14" width="6" height="6"></rect>
        <rect x="14" y="14" width="6" height="6"></rect>
      </symbol>
      <symbol id="icon-code" viewBox="0 0 24 24">
        <path d="m9 18-6-6 6-6"></path>
        <path d="m15 6 6 6-6 6"></path>
      </symbol>
      <symbol id="icon-monitor" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="12" rx="1"></rect>
        <path d="M8 20h8"></path>
        <path d="M12 16v4"></path>
      </symbol>
      <symbol id="icon-spark" viewBox="0 0 24 24">
        <path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6z"></path>
      </symbol>
      <symbol id="icon-help" viewBox="0 0 24 24">
        <path d="M9.5 9a3 3 0 1 1 4.8 2.4c-1.2.8-2.3 1.5-2.3 3.1"></path>
        <path d="M12 19h.01"></path>
      </symbol>
      <symbol id="icon-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21a8 8 0 0 1 16 0"></path>
      </symbol>
      <symbol id="icon-tag" viewBox="0 0 24 24">
        <path d="M20 13 11 22 2 13V4h9l9 9z"></path>
        <circle cx="7.5" cy="9.5" r="1"></circle>
      </symbol>
      <symbol id="icon-send" viewBox="0 0 24 24">
        <path d="m22 2-7 20-4-9-9-4 20-7z"></path>
      </symbol>
      <symbol id="icon-message" viewBox="0 0 24 24">
        <path d="M4 5h16v11H8l-4 4V5z"></path>
      </symbol>
      <symbol id="icon-signal" viewBox="0 0 24 24">
        <path d="M12 21s-7-4.4-7-11a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 6.6-7 11-7 11z"></path>
      </symbol>
      <symbol id="icon-eye" viewBox="0 0 24 24">
        <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </symbol>
      <symbol id="icon-arrow-left" viewBox="0 0 24 24">
        <path d="M19 12H5"></path>
        <path d="m12 19-7-7 7-7"></path>
      </symbol>
      <symbol id="icon-lines" viewBox="0 0 24 24">
        <path d="M5 7h14"></path>
        <path d="M5 12h14"></path>
        <path d="M5 17h9"></path>
      </symbol>
    </svg>

    <main class="forum-shell thread-shell">
      <header class="toon-appbar">
        <a class="brand-mark" href="/" aria-label="Styio Community Forum">
          <span class="brand-icon">S</span>
          <span>
            <strong>Styio Community</strong>
            <small>Post</small>
          </span>
        </a>

        <nav class="top-nav" aria-label="Post navigation">
          <a class="nav-filter" href="/">ALL</a>
          <a class="nav-filter" href="/#composerCard">POST</a>
        </nav>

        <div class="top-actions">
          <a class="toon-button icon-button is-blue" href="/" aria-label="Back" title="Back">
            <svg class="icon"><use href="#icon-arrow-left"></use></svg>
          </a>
        </div>
      </header>

      <section class="thread-main">
        <article id="postDetail" class="detail-card" aria-live="polite"></article>

        <section class="reply-card">
          <div class="section-heading">
            <span class="comic-badge is-blue"><svg class="icon"><use href="#icon-message"></use></svg></span>
            <h2>REPLY</h2>
          </div>
          <ol id="replyList" class="reply-list"></ol>
          <form id="replyForm" class="comment-form">
            <label>
              <span><svg class="icon"><use href="#icon-user"></use></svg></span>
              <input name="author" value="Styio User" maxlength="48" required>
            </label>
            <label>
              <span><svg class="icon"><use href="#icon-lines"></use></svg></span>
              <textarea name="body" rows="4" maxlength="2000" required placeholder="加入你的观点、复现步骤或补充资料。"></textarea>
            </label>
            <button class="toon-button is-green is-wide" type="submit">
              <svg class="icon"><use href="#icon-send"></use></svg>
              <span>发送</span>
            </button>
          </form>
        </section>
      </section>

      <p id="message" class="message" role="status"></p>
    </main>
    <script src="/post.js" defer></script>
  </body>
</html>
